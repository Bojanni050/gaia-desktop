name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Root package.json only carries @tauri-apps/cli — no lockfile to
      # commit to, hence plain install rather than ci.
      - name: Install Tauri CLI
        run: npm install

      - name: Install desktop UI dependencies
        run: npm ci
        working-directory: desktop

      - name: Test desktop UI
        run: npm test
        working-directory: desktop

      # Runs the Tauri build, which first invokes desktop's own
      # beforeBuildCommand (npm --prefix ./desktop run build), then bundles
      # the Rust shell into a Windows installer (MSI + NSIS, per
      # src-tauri/tauri.conf.json's bundle.targets: "all").
      - name: Build the Windows installer
        run: npm run build:desktop

      - name: Create GitHub Release with the installer
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
